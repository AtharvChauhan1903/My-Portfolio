<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f6fb">
    <title>To-Do List</title>
    <link rel="stylesheet" href="../css files/todo.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="Main navigation">
            <a href="../index.html">Home</a>
            <a href="About.html">About</a>
            <a href="Skills.html">Skills</a>
            <a href="project.html">Projects</a>
            <a href="Education.html">Education</a>
            <a href="Contact.html">Contact</a>
        </nav>
    </header>

    <main class="todo-app">
        <section class="todo-card" aria-labelledby="main-heading">
            <p class="eyebrow">Make today count</p>
            <h1 id="main-heading">To-Do List</h1>
            <p class="intro">Keep track of what needs to get done.</p>

            <form id="task-form" class="task-form">
                <label for="task-input">Task</label>
                <input
                    type="text"
                    name="task"
                    id="task-input"
                    placeholder="What do you need to do?"
                    maxlength="200"
                    required
                >

                <label for="task-date">Due date <span>(optional)</span></label>
                <input type="date" name="dueDate" id="task-date">

                <button class="add-button" type="submit">Add task</button>
            </form>

            <p id="status-message" class="status-message" role="alert" aria-live="polite"></p>
            <section class="tasks-section" aria-labelledby="tasks-heading">
                <h2 id="tasks-heading">Your tasks</h2>
                <ul id="task-list" class="task-list" aria-live="polite"></ul>
            </section>
        </section>
    </main>

    <footer class="site-footer">Your tasks are saved in this browser.</footer>
    <script src="../javascript files/todo.js"></script>
</body>
</html>
